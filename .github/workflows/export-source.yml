name: Export patched source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-source.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild base source
        run: |
          cat srcpart0.b64 srcpart1_0.b64 srcpart1_1.b64 srcpart1_2.b64 srcpart1_3.b64 srcpart1_4.b64 srcpart1_5.b64 srcpart1_6.b64 srcpart2.b64 srcpart3.b64 > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip
      - name: Apply patches
        run: |
          python patch_v03.py
          python patch_v04.py
          python patch_v05.py
      - name: Pack patched source
        run: zip -qr VK2Spotify-v0.5-source.zip VK2SpotifyAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: VK2Spotify-v0.5-source
          path: VK2Spotify-v0.5-source.zip
