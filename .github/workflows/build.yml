name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ feature-multisource-v2 ]
    paths:
      - 'srcpart0.b64'
      - 'srcpart1_*.b64'
      - 'srcpart2.b64'
      - 'srcpart3.b64'
      - 'patch_v03.py'
      - 'patch_v04.py'
      - 'patch_v05.py'
      - 'patch_v10.py'
      - 'patch_v11.py'
      - 'patch_v12.py'
      - 'patch_v20.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        run: |
          cat srcpart0.b64 srcpart1_0.b64 srcpart1_1.b64 srcpart1_2.b64 srcpart1_3.b64 srcpart1_4.b64 srcpart1_5.b64 srcpart1_6.b64 srcpart2.b64 srcpart3.b64 > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip
          test -f VK2SpotifyAndroid/app/src/main/java/com/vk2spotify/transfer/MainActivity.java

      - name: Apply v0.3 VK parser fix
        run: python patch_v03.py

      - name: Apply v0.4 Spotify quota fix
        run: python patch_v04.py

      - name: Apply v0.5 resumable transfer
        run: python patch_v05.py

      - name: Apply v1.0 final reliability patch
        run: python patch_v10.py

      - name: Apply v1.1 cancellation fix
        run: python patch_v11.py

      - name: Apply v1.2 quota meter
        run: python patch_v12.py

      - name: Apply v2.0 multisource
        run: python patch_v20.py

      - name: Verify v2.0
        run: |
          grep -q "versionName '2.0.0'" VK2SpotifyAndroid/app/build.gradle
          grep -q "Яндекс Музыка" VK2SpotifyAndroid/app/src/main/java/com/vk2spotify/transfer/MainActivity.java
          grep -q "Звук" VK2SpotifyAndroid/app/src/main/java/com/vk2spotify/transfer/MainActivity.java
          grep -q "startVkWebTransfer" VK2SpotifyAndroid/app/src/main/java/com/vk2spotify/transfer/MainActivity.java
          grep -q "quotaCard" VK2SpotifyAndroid/app/src/main/java/com/vk2spotify/transfer/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: VK2SpotifyAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicTransfer-v2.0-debug-apk
          path: VK2SpotifyAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
