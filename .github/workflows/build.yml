name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'srcpart*.b64'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        run: |
          cat srcpart0.b64 srcpart1.b64 srcpart2.b64 srcpart3.b64 > source.b64
          base64 -d source.b64 > source.zip
          unzip -q source.zip
          test -f VK2SpotifyAndroid/app/src/main/java/com/vk2spotify/transfer/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: VK2SpotifyAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VK2Spotify-debug-apk
          path: VK2SpotifyAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
